<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>钛银翼伞 · 三维外观展示</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{position:relative}#fallback{position:absolute;width:100%;height:100%;object-fit:contain;transition:opacity .7s;background:#000}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:pan-y;opacity:0;transition:opacity 1s}body.ready canvas{opacity:1}body.ready #fallback{opacity:0;pointer-events:none}.controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:9px;align-items:center;z-index:2;max-width:calc(100% - 24px)}.group{display:flex;gap:3px;padding:5px;background:rgba(40,40,44,.88);border:1px solid #414147;border-radius:100px;backdrop-filter:blur(20px)}button{white-space:nowrap;color:#d2d2d7;border:0;background:none;min-height:38px;padding:0 16px;border-radius:100px;font-size:13px;cursor:pointer}button[aria-pressed=true]{color:#151517;background:#eeeef2}button:focus-visible{outline:2px solid #2997ff;outline-offset:3px}#motion{min-width:44px;min-height:44px;padding:0;border:1px solid #414147;background:#28282c;color:#eee;font-size:16px}#hint{position:absolute;left:32px;bottom:26px;font-size:12px;line-height:1.6;color:#a1a1a6;pointer-events:none;margin:0}#status{position:absolute;right:28px;top:18px;color:#a1a1a6;font-size:12px;margin:0}.error{color:#d2d2d7!important}.focus-row{position:absolute;right:24px;top:54px;display:grid;gap:7px;z-index:2}.focus-row button{background:#242426;border:1px solid #3d3d42;font-size:12px;min-height:36px;padding:0 13px;color:#c8c8ce}.focus-row button[aria-pressed=true]{background:#e8e8ed;color:#1d1d1f}button:disabled{opacity:.45;cursor:wait}@media(max-width:640px){#hint{left:16px;bottom:78px;font-size:11px}#status{right:16px;top:14px;font-size:11px}.focus-row{right:14px;top:43px;gap:5px}.focus-row button{padding:0 10px;min-height:32px;font-size:11px}.controls{bottom:15px;gap:7px}button{padding:0 13px;font-size:12px}.group{padding:4px}}@media(prefers-reduced-motion:reduce){canvas,#fallback{transition:none}}
</style>
